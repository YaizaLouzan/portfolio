/* ==============================
   1. STYLE GÉNÉRAL
============================== */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 120px;
}

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  color: #333;
  background-color: #f9f9f9;
  line-height: 1.6;
}

a {
  overflow-wrap: anywhere;
}

:focus-visible {
  outline: 2px solid #9b70b5;
  outline-offset: 4px;
}


/* ==============================
   2. HEADER ET NAVIGATION
============================== */

header {
  background-color: #354550;
  color: white;
  padding: 12px 24px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 8px;
  position: sticky;
  top: 0;
  width: 100%;
  z-index: 1000;
}

header h1 {
  font-size: 1.5rem;
  font-weight: 600;
  margin: 0;
  text-align: center;
}

nav {
  max-width: 100%;
}

nav ul {
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 8px 20px;
  margin: 0;
  padding: 0;
}

nav ul li {
  font-size: 0.95rem;
  font-weight: 300;
}

nav ul li a {
  display: inline-block;
  color: white;
  text-decoration: none;
  padding: 4px 0;
  transition: color 0.2s ease;
}

nav ul li a:hover {
  color: #d4aeee;
}


/* Menu sur grand écran */

@media (min-width: 1024px) {
  header {
    flex-direction: row;
    justify-content: space-between;
    padding: 16px 5%;
  }

  nav ul {
    justify-content: flex-end;
  }
}


/* Menu sur téléphone */

@media (max-width: 480px) {
  header {
    padding: 10px 12px;
  }

  header h1 {
    font-size: 1.25rem;
  }

  nav ul {
    gap: 4px 12px;
  }

  nav ul li {
    font-size: 0.82rem;
  }
}


/* ==============================
   3. BANNIÈRE D'ACCUEIL
============================== */

.hero {
  min-height: 75vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: linear-gradient(
    to bottom right,
    #422c50,
    #e2c6f5
  );
  color: white;
  padding: clamp(32px, 6vw, 80px) 20px;
}

.hero h2 {
  font-size: clamp(1.8rem, 5vw, 3rem);
  line-height: 1.2;
  margin: 0 0 12px;
  overflow-wrap: anywhere;
}

.hero p {
  font-size: clamp(1rem, 2.5vw, 1.2rem);
  font-weight: 300;
  margin: 0;
}


/* ==============================
   4. SECTIONS
============================== */

.section {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: clamp(32px, 5vw, 60px)
           clamp(16px, 4vw, 50px);
  text-align: center;
  scroll-margin-top: 120px;
}

.section h3 {
  font-size: clamp(1.5rem, 3vw, 2rem);
  line-height: 1.3;
  margin: 0 0 24px;
}

.section p {
  overflow-wrap: anywhere;
}


/* ==============================
   5. GRILLES ET CARTES
============================== */

.skills,
.projects {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(min(100%, 250px), 1fr));
  gap: 20px;
  align-items: stretch;
}

.skills > div,
.projects > div,
.skills > article {
  min-width: 0;
  padding: 20px;
  border: 1px solid #e3e0e5;
  border-radius: 12px;
  background-color: white;
  overflow-wrap: anywhere;
  transition:
    box-shadow 0.2s ease,
    border-color 0.2s ease;
}

.skills > div:hover,
.projects > div:hover,
.skills > article:hover {
  border-color: #cdb5dc;
  box-shadow: 0 8px 24px rgba(53, 69, 80, 0.10);
}

.skills h4,
.projects h4 {
  margin-top: 0;
}


/* ==============================
   6. FORMATIONS : VOIR PLUS
============================== */

.formation-card {
  text-align: left;
}

.formation-role {
  color: #666;
  font-size: 0.95rem;
}

.formation-details {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid #eee;
}

.formation-details summary {
  color: #79518f;
  font-weight: 600;
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.formation-details summary::-webkit-details-marker {
  display: none;
}

.formation-details summary::after {
  content: "+";
  font-size: 1.4rem;
  line-height: 1;
}

.formation-details[open] summary::after {
  content: "−";
}

.formation-details ul {
  padding-left: 20px;
  line-height: 1.8;
  color: #555;
}

.formation-details li {
  margin-bottom: 4px;
}


/* ==============================
   7. CONTACT
============================== */

#contact a {
  color: #79518f;
  text-decoration: none;
  font-weight: 600;
}

#contact a:hover {
  text-decoration: underline;
}


/* ==============================
   8. PIED DE PAGE
============================== */

footer {
  background-color: #354550;
  color: white;
  text-align: center;
  padding: 20px;
}

footer p {
  margin: 8px 0;
}

footer a {
  color: #d1d6ec;
  text-decoration: none;
  font-weight: 600;
}

footer a:hover {
  color: #d4aeee;
}


/* ==============================
   9. RESPONSIVE TÉLÉPHONE
============================== */

@media (max-width: 600px) {
  .hero {
    min-height: 65vh;
  }

  .section {
    padding: 36px 16px;
  }

  .skills,
  .projects {
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .skills > div,
  .projects > div,
  .skills > article {
    padding: 18px;
  }

  #contact {
    overflow-wrap: anywhere;
  }
}


/* ==============================
   10. ACCESSIBILITÉ
============================== */

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}
